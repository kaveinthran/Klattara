name: Build latest upstream Klattara NVDA add-on

on:
  schedule:
    - cron: '37 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: upstream-klattara-nvda-release
  cancel-in-progress: false

jobs:
  check:
    name: Check and sync original upstream
    if: github.repository == 'kaveinthran/Klattara' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.upstream.outputs.sha }}
      build_needed: ${{ steps.upstream.outputs.build_needed }}
      previous_sha: ${{ steps.upstream.outputs.previous_sha }}
      community_version: ${{ steps.upstream.outputs.community_version }}
      nvda_x64: ${{ steps.test_sources.outputs.nvda_x64 }}
      nvda_x86: ${{ steps.test_sources.outputs.nvda_x86 }}
      python_x64: ${{ steps.test_sources.outputs.python_x64 }}
      python_x86: ${{ steps.test_sources.outputs.python_x86 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Test automation boundaries and builder routing
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py'
      - name: Read pinned official NVDA test dependencies
        id: test_sources
        run: |
          python3 - <<'PY'
          import json, os, re
          from pathlib import Path
          sources = json.loads(Path('.github/nvda-test-sources.json').read_text(encoding='utf-8'))
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              for arch in ('x64', 'x86'):
                  revision = sources[arch]['revision']
                  version = sources[arch]['python']
                  assert re.fullmatch(r'[0-9a-f]{40}', revision)
                  assert re.fullmatch(r'3\.[0-9]+', version)
                  output.write(f'nvda_{arch}={revision}\npython_{arch}={version}\n')
          PY
      - name: Check source, sync fork and decide whether to build
        id: upstream
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/auto_release.py check

  build:
    name: Build and test both Windows architectures
    needs: check
    if: needs.check.outputs.build_needed == 'true'
    runs-on: windows-latest
    timeout-minutes: 40
    permissions:
      contents: read
    env:
      SOURCE_SHA: ${{ needs.check.outputs.sha }}
      PREVIOUS_SHA: ${{ needs.check.outputs.previous_sha }}
      COMMUNITY_VERSION: ${{ needs.check.outputs.community_version }}
      PYTHONDONTWRITEBYTECODE: '1'
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Get trusted fork automation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: automation
          persist-credentials: false
      - name: Get exact original upstream source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: RetroBunn/Klattara
          ref: ${{ needs.check.outputs.sha }}
          path: upstream
          fetch-depth: 0
          persist-credentials: false
      - name: Get official NVDA 2026.2 source for x64 driver tests
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: nvaccess/nvda
          ref: ${{ needs.check.outputs.nvda_x64 }}
          path: upstream/nvda
          persist-credentials: false
      - name: Get official NVDA 2025.1 source for x86 compatibility tests
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: nvaccess/nvda
          ref: ${{ needs.check.outputs.nvda_x86 }}
          path: upstream/nvda-release-2025.1
          persist-credentials: false
      - name: Set up Python 3.11 x86 for 32-bit NVDA
        id: python_x86
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ needs.check.outputs.python_x86 }}
          architecture: x86
      - name: Set up Python 3.13 x64 for 64-bit NVDA
        id: python_x64
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ needs.check.outputs.python_x64 }}
          architecture: x64
      - name: Install Rust toolchain and x86 target
        run: |
          rustup toolchain install stable --profile minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustup default stable
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustup target add i686-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test release-mode Rust workspace and all targets (x64)
        working-directory: upstream
        run: cargo test --locked --release --workspace --all-targets
      - name: Test release-mode engine and C interface (x86)
        working-directory: upstream
        run: cargo test --locked --release -p klattara -p klattara-windows --target i686-pc-windows-msvc
      - name: Build original dual-architecture add-on and run both driver suites
        env:
          PYTHON_X64: ${{ steps.python_x64.outputs.python-path }}
          PYTHON_X86: ${{ steps.python_x86.outputs.python-path }}
        run: |
          & $env:PYTHON_X64 automation/.github/scripts/auto_release.py prepare --source upstream
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $env:PYTHON_X64 automation/.github/scripts/build_upstream.py --source upstream --python-x64 $env:PYTHON_X64 --python-x86 $env:PYTHON_X86
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Inspect both DLLs, provenance and licences and prepare release
        env:
          PYTHON_X64: ${{ steps.python_x64.outputs.python-path }}
        run: '& $env:PYTHON_X64 automation/.github/scripts/auto_release.py package --source upstream --output release'
      - name: Upload validated release files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: klattara-release-${{ needs.check.outputs.sha }}
          path: release/*
          if-no-files-found: error
          retention-days: 3
          compression-level: 0

  publish:
    name: Publish verified Klattara GitHub release
    needs: [check, build]
    if: needs.check.outputs.build_needed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Get trusted publishing automation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Download validated release as data
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: klattara-release-${{ needs.check.outputs.sha }}
          path: release
      - name: Validate, publish and anonymously verify download
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ needs.check.outputs.sha }}
        run: python3 .github/scripts/auto_release.py publish --root release
